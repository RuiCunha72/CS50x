{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}

    <div>
        <h1>Holdings</h1>
        <table class="table table-dark table-striped-columns">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Symbol</th>
                    <th>Shares</th>
                    <th>Current Price</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody>
                {% for item in portfolio %}
                    <tr>
                        <td>{{ item.name }}</td>
                        <td>{{ item.symbol }}</td>
                        <td>{{ item.shares }}</td>
                        <td>{{ item.price | usd}}</td>
                        <td>{{ item.total | usd}}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <form action="/sell" method="post">
        <div class="mb-3">
            <select id="symbol" name="symbol">
                <option disabled selected value="">Holding</option>
                {% for symbol in symbols %}
                    <option value="{{ symbol }}">{{ symbol }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="shares" placeholder="Amount" type="number" step="any">
        </div>
        <button class="btn btn-primary" type="submit">Sell</button>
    </form>
{% endblock %}
